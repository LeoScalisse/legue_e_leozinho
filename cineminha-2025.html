<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cineminha 2025</title>
<link href="src/css/style.css" rel="stylesheet">
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<main class="container cineminha-page movie-year-page" data-movie-year="2025">
  <a class="profile-back" href="./cineminha.html">&lt; Voltar para o Cineminha</a>

  <header class="cineminha-header">
    <div class="title-heart">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 31 C18 31 4 22 4 13 C4 8 8 5 12 5 C14.5 5 17 6.5 18 9 C19 6.5 21.5 5 24 5 C28 5 32 8 32 13 C32 22 18 31 18 31Z" fill="#7ec8e3" opacity="0.8"/>
      </svg>
      <h1>Filmes de 2025</h1>
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 31 C18 31 4 22 4 13 C4 8 8 5 12 5 C14.5 5 17 6.5 18 9 C19 6.5 21.5 5 24 5 C28 5 32 8 32 13 C32 22 18 31 18 31Z" fill="#7ec8e3" opacity="0.8"/>
      </svg>
    </div>
    <p class="subtitle">Os filmes que marcaram esse ano do nosso cineminha.</p>
  </header>

  <section class="movie-year-highlights" aria-label="Destaques do ano" id="movieYearHighlights"></section>

  <section class="movie-library" aria-labelledby="libraryTitle">
    <div class="movie-library-heading">
      <div>
        <h2 id="libraryTitle">Filmes vistos em 2025</h2>
        <p id="movieCount">0 filmes assistidos em 2025</p>
      </div>
    </div>
    <div class="movie-grid" id="movieGrid"></div>
  </section>
</main>

<div class="movie-rating-modal" id="movieRatingModal" onclick="closeMovieRatingModal()" aria-hidden="true">
  <div class="movie-rating-modal-content" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="movieRatingTitle">
    <button class="movie-rating-modal-close" type="button" onclick="closeMovieRatingModal()" aria-label="Fechar">x</button>
    <div class="movie-rating-modal-main">
      <div class="movie-rating-modal-poster" id="movieRatingPoster"></div>
      <div class="movie-rating-modal-info">
        <div class="movie-rating-modal-heading">
          <h2 id="movieRatingTitle"></h2>
          <span id="movieRatingYear"></span>
        </div>
        <div class="movie-rating-form">
          <label>
            Legué
            <input type="number" id="modalLegueRating" min="0" max="10" step="any" placeholder="0 a 10">
          </label>
          <label>
            Leozinho
            <input type="number" id="modalLeozinhoRating" min="0" max="10" step="any" placeholder="0 a 10">
          </label>
          <label>
            Observação da Legué
            <textarea id="modalLegueObservation" rows="3" placeholder="O que a Legué achou?"></textarea>
          </label>
          <label>
            Observação do Leozinho
            <textarea id="modalLeozinhoObservation" rows="3" placeholder="O que o Leozinho achou?"></textarea>
          </label>
          <label class="movie-rating-date">
            Assistido em
            <input type="date" id="modalWatchedAt">
          </label>
        </div>
        <div class="movie-rating-modal-actions">
          <button type="button" class="movie-rating-save" onclick="saveMovieRatingModal()">Salvar notas</button>
          <button type="button" class="btn-del movie-delete" onclick="deleteMovieFromModal()">Excluir</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/js/supabase-config.js"></script>
<script src="src/js/supabase-client.js"></script>
<script src="src/js/cineminha.js"></script>
</body>
</html>
